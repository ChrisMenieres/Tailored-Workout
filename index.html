<style>
/* ---------- tokens ---------- */
:root{
  --bg:#0b0d14; --bg2:#0f1220;
  --card:#151a2b; --card2:#1c2238; --field:#1f2640;
  --ink:#eef0f6; --mute:#8f95ab; --dim:#5d6380;
  --line:#262d45;
  --good:#3ddc97; --warn:#ffc14d; --bad:#ff6b7a;
  --acc:#34d0b6; --acc2:#7c5cff; --hot:#ff6b3d; --gold:#ffd166;
  --r:18px; --rs:12px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
body[data-goal="general"]{--acc:#34d0b6;--acc2:#5ad1ff}
body[data-goal="cardio"]{--acc:#ff6b3d;--acc2:#ffb347}
body[data-goal="strength"]{--acc:#8b6cff;--acc2:#ff5c8a}
body[data-goal="flex"]{--acc:#b28cff;--acc2:#5ee7c9}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;background:radial-gradient(1200px 700px at 70% -10%,rgba(124,92,255,.14),transparent 60%),
       radial-gradient(900px 600px at -10% 40%,rgba(52,208,182,.10),transparent 60%),var(--bg);
  color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;min-height:100vh;
  overscroll-behavior-y:none;
}
#app{max-width:34rem;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 96px)}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.35rem;font-weight:750}
h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 10px}
.mute{color:var(--mute)} .dim{color:var(--dim)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.acc{color:var(--acc)} .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{margin-top:14px} .mt2{margin-top:24px} .mb{margin-bottom:14px}
.hide{display:none!important}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.card.glow{box-shadow:0 0 0 1px rgba(255,255,255,.03),0 18px 50px -20px color-mix(in srgb,var(--acc) 55%,transparent)}
.card.hero{padding:0;min-height:190px}
.card.hero .heroArt{position:absolute;inset:0;pointer-events:none}
.card.hero .heroArt::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,26,43,0) 25%,rgba(21,26,43,.92) 88%)}
.card.hero.artRight .heroArt{left:38%;opacity:.8}
.card.hero.artRight .heroArt::after{background:linear-gradient(100deg,rgba(21,26,43,.95) 8%,rgba(21,26,43,0) 55%,rgba(21,26,43,.6) 100%)}
.card.hero.artRight .heroBody h1,.card.hero.artRight .heroBody .eyebrow{max-width:100%}
.card.hero .heroBody{position:relative;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;min-height:190px}
.card.hero .heroBody h1,.card.hero .heroBody h2,.card.hero .heroBody .eyebrow,.card.hero .heroBody .small{max-width:68%}
.card.hero .heroArt{opacity:.9}
.eyebrow{font-size:.8rem;color:var(--mute);margin-bottom:4px}
.big{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--field);font-size:.8rem;color:var(--mute)}
.pill.on{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.chip{display:inline-block;padding:9px 13px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-size:.92rem;color:var(--ink);cursor:pointer}
.chip.on{background:color-mix(in srgb,var(--acc) 25%,transparent);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card2);border-radius:var(--rs);border:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600}
.item .sub{color:var(--mute);font-size:.84rem}
.divider{height:1px;background:var(--line);margin:14px 0}
.bar{height:8px;background:var(--field);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* ---------- buttons & inputs ---------- */
button{font-family:inherit;font-size:1rem;font-weight:600;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;-webkit-appearance:none;color:#0b0d14;background:var(--acc);width:100%;transition:transform .12s ease,opacity .12s ease}
button:active{transform:scale(.985);opacity:.85}
button.sec{background:var(--field);color:var(--ink);border:1px solid var(--line)}
button.ghost{background:transparent;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
button.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
button.sm{padding:9px 13px;font-size:.9rem;border-radius:11px;width:auto}
button.icon{width:auto;padding:8px 12px;background:var(--field);color:var(--ink);border-radius:10px;font-weight:700}
button:disabled{opacity:.45}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
label{display:block;color:var(--mute);font-size:.86rem;margin:0 0 6px}
button,.chip,.ok,.item,.optcard,a,[onclick]{touch-action:manipulation}
input,select,textarea{width:100%;font-family:inherit;font-size:1.05rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:13px 14px;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
input[type=number]{font-variant-numeric:tabular-nums}
.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.setrow input{padding:10px 8px;text-align:center;font-size:1rem}
.setrow .n{color:var(--mute);font-size:.85rem;text-align:center}
.setrow .ok{width:44px;height:44px;border-radius:12px;background:var(--field);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:1.1rem}
.setrow .ok.on{background:color-mix(in srgb,var(--good) 25%,transparent);color:var(--good);border-color:var(--good)}
.hdr5{display:grid;grid-template-columns:34px 1fr 1fr 1fr 44px;gap:8px;color:var(--dim);font-size:.72rem;text-align:center;margin-top:10px}

/* ---------- nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(var(--sab) + 8px);background:rgba(11,13,20,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:20}
nav.tabs .inner{max-width:34rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--mute);text-decoration:none;font-size:.68rem;font-weight:600;border-radius:12px}
nav.tabs a.on{color:var(--acc)}
nav.tabs a svg{width:24px;height:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.back{width:auto;padding:8px 12px;background:var(--field);color:var(--ink);border-radius:10px;font-weight:700}

/* ---------- toast / sheet ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 100px);transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:12px 16px;border-radius:14px;font-size:.92rem;opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(var(--sab) + 18px);width:100%;max-width:34rem;max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
.sheet .handle{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px}

/* ---------- onboarding ---------- */
.steps{display:flex;gap:6px;margin:8px 0 22px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--field)}
.steps i.on{background:var(--acc)}
.optcard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r);background:var(--card2);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink);font-weight:500}
.optcard.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card2))}
.optcard .ic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--field)}
.optcard .t{font-weight:700}
.optcard .d{color:var(--mute);font-size:.84rem;font-weight:400}
.daybtns{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daybtns button{padding:12px 0;font-size:.9rem;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:12px}
.daybtns button.on{background:var(--acc);color:#0b0d14;border-color:var(--acc)}

/* ---------- heart rate ---------- */
.hrbar{position:relative;height:10px;background:var(--field);border-radius:999px;margin:10px 0 4px}
.hrbar .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 45%,transparent);border-radius:999px}
.hrbar > i{position:absolute;top:-4px;width:6px;height:18px;border-radius:3px;background:var(--ink);transform:translateX(-3px);transition:left .5s ease}

/* ---------- figure ---------- */
.figure{display:block;width:100%;height:auto;max-width:280px;margin:0 auto}
.figbox{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:8px;position:relative;overflow:hidden}
.figbox.sm{padding:0;border:0;background:transparent}
.figbox .cap{position:absolute;left:12px;bottom:10px;font-size:.72rem;color:var(--dim)}
.figthumb{width:64px;height:64px;flex:none;background:var(--field);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.figthumb .figure{max-width:none;width:64px;height:64px}
.item .figthumb{margin-right:-2px}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .raw{fill:var(--mute);opacity:.55}
.chart .trend{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .tgt{stroke:var(--gold);stroke-dasharray:4 5;stroke-width:1.5}
.chart text{fill:var(--dim);font-size:10px}

/* ---------- session ---------- */
.exhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.exhead .name{font-weight:700;font-size:1.05rem}
.exhead .meta{color:var(--mute);font-size:.82rem}
.stopwatch{font-variant-numeric:tabular-nums;font-size:3.2rem;font-weight:800;letter-spacing:-.04em;text-align:center;line-height:1}
.phase{font-size:1.1rem;font-weight:700;text-align:center;margin-top:6px}
.phase.hard{color:var(--hot)} .phase.easy{color:var(--acc)}
.timerWrap{padding:22px 0 10px;text-align:center}

/* ---------- animation stage ---------- */
.stage{width:100%;height:auto;display:block}
.stage *{transform-box:fill-box;transform-origin:center}
@keyframes flick{0%{transform:scaleY(1) skewX(0)}30%{transform:scaleY(1.07) skewX(-2deg)}55%{transform:scaleY(.95) skewX(2deg)}80%{transform:scaleY(1.04) skewX(-1deg)}100%{transform:scaleY(1) skewX(0)}}
@keyframes ember{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:.9}100%{transform:translateY(-70px) scale(.2);opacity:0}}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:.75}100%{transform:translate(-60px,-24px) scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-60}}
@keyframes zap{0%,100%{opacity:0;transform:scale(.7)}10%{opacity:1;transform:scale(1.05)}18%{opacity:.3}24%{opacity:1}40%{opacity:0}}
@keyframes launch{0%{transform:translateY(0)}20%{transform:translateY(4px)}100%{transform:translateY(-260px) scale(.9)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-200}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:var(--to)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.15);opacity:.9}}
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 4px var(--acc))}50%{filter:drop-shadow(0 0 14px var(--acc))}}
.flame .f1{animation:flick 1.1s ease-in-out infinite}
.flame .f2{animation:flick .8s ease-in-out infinite reverse}
.flame .f3{animation:flick .6s ease-in-out infinite}
.flame .em{animation:ember 2.2s ease-out infinite}
.smoke circle{animation:puff 1.6s ease-out infinite}
.wheel{animation:spin .55s linear infinite}
.motion{stroke-dasharray:14 10;animation:dash .5s linear infinite}
.bolt{animation:zap 2.4s ease-in-out infinite}
.rocket.go{animation:launch 1.7s cubic-bezier(.5,0,.9,.2) forwards}
.rocket.idle{animation:bob 2.6s ease-in-out infinite}
.rocket .exh{animation:flick .35s ease-in-out infinite}
.star{animation:twinkle 2s ease-in-out infinite}
.ribbon{stroke-dasharray:24 16;animation:flow 6s linear infinite}
.pop{animation:pop .5s cubic-bezier(.2,.9,.2,1.2) both}
.sparkle{animation:spark 1s ease-out forwards}
.orb{animation:breathe 4s ease-in-out infinite}
.ring .arc{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.glowing{animation:pulseGlow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .stage *,.rocket,.ring .arc{animation:none!important}
  .ring .arc{stroke-dashoffset:var(--to)!important}
}
body.calm .stage *,body.calm .ring .arc{animation:none!important}
body.calm .ring .arc{stroke-dashoffset:var(--to)!important}

/* ---------- misc ---------- */
.kbd{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.85rem;background:var(--field);padding:2px 6px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:700;letter-spacing:.02em;background:var(--field);color:var(--mute)}
.tag.acc{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.tag.hot{background:color-mix(in srgb,var(--hot) 22%,transparent);color:var(--hot)}
.tag.good{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.ol{padding-left:20px;margin:6px 0} .ol li{margin-bottom:6px}
.fade{animation:pop .35s ease both}
details{border:1px solid var(--line);border-radius:var(--rs);padding:10px 14px;background:var(--card2)}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:8px}
a{color:var(--acc)}

/* interval cue flash */
.cue{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px) scale(.92);opacity:0;pointer-events:none;z-index:90;
  min-width:62%;max-width:92%;padding:14px 22px;border-radius:22px;text-align:center;background:var(--acc);color:#07120f;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:opacity .22s,transform .28s cubic-bezier(.2,1.4,.4,1)}
.cue.show{opacity:1;transform:translate(-50%,0) scale(1)}
.cue.hot{background:#ff6b5b;color:#1a0503}.cue.warn{background:var(--gold,#ffd166);color:#1d1400}
.cueT{font-size:34px;font-weight:800;letter-spacing:.02em;line-height:1.05}.cueS{font-size:17px;font-weight:600;opacity:.85;margin-top:2px}
body.calm .cue{transition:none}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.nextline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px -4px;font-size:14px;color:var(--mute)}
.nextline button{width:auto;flex:none}

.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.swatch{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.15);flex:none}
.swatch.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(52,208,182,.25)}
.lookprev{width:120px;height:120px;flex:none;border-radius:18px;background:var(--bg2,#1b2033);overflow:hidden}.lookprev svg{width:100%;height:100%}
</style>

<body data-goal="general">
<div id="app"></div>
<div id="toast"></div>
<script>
/* =========================================================
   Tailored Workout — single-file app
   Sections: core · library · program · math · bridge · ui
   ========================================================= */
'use strict';

/* ---------- utils ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const round = (v, step) => Math.round(v / step) * step;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYSL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function dstr(d) { d = d || new Date(); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function dparse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function daysBetween(a, b) { return Math.round((dparse(b) - dparse(a)) / 86400000); }
function addDays(s, n) { const d = dparse(s); d.setDate(d.getDate() + n); return dstr(d); }
function todayStr() { return dstr(new Date()); }
function fmtMins(m) { if (m < 60) return m + ' min'; const hh = Math.floor(m / 60), mm = m % 60; return mm ? hh + 'h ' + mm : hh + ' hr'; }
function niceDate(s) { const d = dparse(s); return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()]; }
const KG = 0.45359237, CM = 2.54;
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms || 2200); }
function h(strings, ...vals) { return strings.reduce((a, s, i) => a + s + (i < vals.length ? (Array.isArray(vals[i]) ? vals[i].join('') : (vals[i] ?? '')) : ''), ''); }

/* ---------- storage ---------- */
const KEY = 'tailored_v1';
function defaultState() {
  return {
    v: 1,
    profile: null,           // set by onboarding
    program: null,           // generated weekly plan
    sessions: [],            // completed sessions
    calib: {},               // exId -> {e1rm, maxReps, testedAt}
    loads: {},               // exId -> {weight (kg), reps}
    weights: [],             // {date, kg, source}
    readiness: [],           // {date, hrv, rhr, sleep, score, level}
    intake: [],              // {weekOf, kcal, protein}  (tier 3, optional manual)
    adjust: [],              // {date, kcal, note}
    intensity: 1.0,          // global multiplier from feedback
    lastAdjust: null,
    scLinks: {}, scBuilt: {},
    shortcuts: { readWeight: 'WT Read Weight', logStrength: 'WT Log Strength', logCardio: 'WT Log Cardio', readiness: 'WT Readiness', logWeight: 'WT Log Weight' },
    flags: { calm: false, showCal: true, cycle28: false, pace: 'standard', mute: false },
    pending: null,
    active: null,            // in-progress session
    swaps: {},               // dayIdx-slot -> exId
    seen: { onboardedAt: null, tipsDismissed: [], lenDismissed: null },
    pace: null
  };
}
/* make any saved or imported object safe to use: right types everywhere, defaults filled in */
function normalizeState(s) {
  const d = defaultState(), arr = v => Array.isArray(v) ? v : [], obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  const out = Object.assign(d, s, {
    shortcuts: Object.assign(defaultState().shortcuts, obj(s.shortcuts)), flags: Object.assign(defaultState().flags, obj(s.flags)),
    seen: Object.assign(defaultState().seen, obj(s.seen)), scLinks: obj(s.scLinks), scBuilt: obj(s.scBuilt),
    sessions: arr(s.sessions).filter(x => x && typeof x.date === 'string'), weights: arr(s.weights).filter(w => w && typeof w.date === 'string' && isFinite(w.kg)),
    readiness: arr(s.readiness).filter(r => r && typeof r.date === 'string'), intake: arr(s.intake), adjust: arr(s.adjust),
    calib: obj(s.calib), loads: obj(s.loads), swaps: obj(s.swaps), intensity: isFinite(s.intensity) ? clamp(s.intensity, 0.7, 1.3) : 1
  });
  if (out.profile && (typeof out.profile !== 'object' || !Array.isArray(out.profile.days))) out.profile = null;
  if (out.profile && !Array.isArray(out.profile.equipment)) out.profile.equipment = [];
  if (out.program && !(out.program.week && Array.isArray(out.program.week))) out.program = null;
  if (out.active && !(out.active.base && out.active.stage)) out.active = null;
  return out;
}
let S = load();
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { return defaultState(); }
  if (!raw) return defaultState();
  try { return normalizeState(JSON.parse(raw)); }
  catch (e) {
    // never overwrite data we couldn't read: park it where a backup import can still reach it
    try { localStorage.setItem(KEY + '_corrupt', raw); } catch (e2) { }
    load.failed = true; console.warn('load failed', e);
    return defaultState();
  }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save. Storage may be full or blocked.'); } }

/* ---------- units ---------- */
function useLb() { return !S.profile || S.profile.units !== 'kg'; }
function fmtW(kg, dec) { if (kg == null) return '—'; const v = useLb() ? kg / KG : kg; return (dec == null ? (v < 10 ? v.toFixed(1) : Math.round(v)) : v.toFixed(dec)) + (useLb() ? ' lb' : ' kg'); }
function fmtWn(kg, dec) { if (kg == null) return '—'; const v = useLb() ? kg / KG : kg; return dec == null ? (v < 10 ? v.toFixed(1) : String(Math.round(v))) : v.toFixed(dec); }
function unitW() { return useLb() ? 'lb' : 'kg'; }
function toKg(v) { return useLb() ? v * KG : v; }
function fmtDist(km) { return useLb() ? (km / 1.609).toFixed(2) + ' mi' : km.toFixed(2) + ' km'; }

  if (!ex.equip.includes('bb') && !ex.equip.includes('machine') && !ex.equip.includes('cable')) return useLb() ? 2.5 * KG : 1;

function availEquip(p) {
  const set = new Set(['bw', 'outdoor']);
  if (p.setting === 'home_none') return set;   // "Home + no gear" is bodyweight only, whatever is ticked
  if (p.setting === 'gym') ['db', 'kb', 'bb', 'band', 'bar', 'bench', 'cable', 'machine', 'treadmill', 'bike', 'rower', 'elliptical', 'rope'].forEach(k => set.add(k));  // a gym does not give you a mountain bike
  (p.equipment || []).forEach(k => set.add(k));
  return set;
}
// equipment preference order per setting
function equipRank(p) {
  if (p.goal === 'strength') return ['bb', 'db', 'kb', 'machine', 'cable', 'bar', 'band', 'bw'];
  if (p.setting === 'gym') return ['db', 'bb', 'cable', 'machine', 'kb', 'bar', 'band', 'bw'];
  return ['db', 'kb', 'bar', 'band', 'bench', 'bw'];
}
function candidates(pattern, p, exclude, excludeRegions) {
  const avail = availEquip(p), rank = equipRank(p);
  return EX.filter(e => e.pat === pattern && !exclude.has(e.id)
      && e.equip.some(q => avail.has(q))
      && (e.needs || []).every(q => avail.has(q))
      && (!excludeRegions || !e.reg.some(r => excludeRegions.has(r))))
    .sort((a, b) => {
      const ha = S.loads[a.id] || S.calib[a.id] ? 0 : 1, hb = S.loads[b.id] || S.calib[b.id] ? 0 : 1;
      if (ha !== hb) return ha - hb;
      const ra = Math.min(...a.equip.map(q => rank.indexOf(q) < 0 ? 99 : rank.indexOf(q))), rb = Math.min(...b.equip.map(q => rank.indexOf(q) < 0 ? 99 : rank.indexOf(q)));
      return ra - rb;
    });
}
function repRange(p, ex) {
  if (p.goal === 'strength') return ex.big ? [5, 8] : [8, 12];
  if (p.goal === 'cardio' || p.goal === 'flex') return [10, 15];
  return [8, 12];
}
function setsFor(p, ex) {
  if (p.minutes < 30) return 2;
  if (p.goal === 'strength' && ex.big && p.minutes >= 60) return 4;
  return 3;
}
function buildStrength(type, p, dayIdx) {
  const pats = PATTERNS[type];
  const warm = p.goal === 'flex' ? 10 : 6;
  const cardioTail = type === 'H' ? Math.min(15, Math.round(p.minutes * 0.3)) : 0;
  // minutes per set (work + rest) is learned from your own ticks; 2.3 until there's data
  const perSet = clamp((S.pace && S.pace.minPerSet) || 2.3, 1.2, 5);
  const perEx = (p.minutes < 30 ? 2 : 3) * perSet + 0.6;
  const slots = clamp(Math.floor((p.minutes - warm - cardioTail) / perEx), 2, pats.length);
  const used = new Set(); const list = [];
  for (let i = 0; i < pats.length && list.length < slots; i++) {
    const pat = pats[i];
    const swapKey = dayIdx + ':' + i;
    let ex = S.swaps[swapKey] ? EXMAP[S.swaps[swapKey]] : null;
    if (!ex || used.has(ex.id)) { const c = candidates(pat, p, used); ex = c[0]; }
    if (!ex) { const fb = PAT_FALLBACK[pat]; if (fb) { const c = candidates(fb, p, used); ex = c[0]; } }
    if (!ex) continue;
    used.add(ex.id);
    const [lo, hi] = repRange(p, ex);
    list.push({ exId: ex.id, pat, sets: setsFor(p, ex), lo, hi, slot: i });
  }
  const mob = p.goal === 'flex' ? pickMob(4, dayIdx) : pickMob(2, dayIdx);
  const sess = { type, title: TYPE_INFO[type].title, kind: 'strength', exercises: list, mobility: mob, warm };
  if (cardioTail) sess.cardio = buildCardio('C', p, dayIdx, cardioTail);
  return sess;
}
function pickMob(n, seed) {
  const out = []; for (let i = 0; i < n; i++) out.push(MOB[(seed * 3 + i * 5) % MOB.length].id); return out;
}
function cardioModes(p) {
  const avail = availEquip(p);
  let list = CARDIO.filter(c => c.equip.some(q => avail.has(q)));
  const pref = p.goal === 'cardio' ? ['run', 'bike', 'row', 'tread', 'rope', 'ellip', 'circuit', 'walk'] : ['bike', 'tread', 'run', 'row', 'ellip', 'rope', 'circuit', 'walk'];
  if (p.cardioLevel === 'beg') pref.unshift('walk');
  return list.sort((a, b) => pref.indexOf(a.id) - pref.indexOf(b.id));
}
function buildCardio(type, p, dayIdx, minutesOverride) {
  const modes = cardioModes(p);
  const mode = modes[dayIdx % Math.max(1, Math.min(modes.length, 2))] || modes[0];
  const mins = minutesOverride || p.minutes;
  const lvl = p.cardioLevel || 'beg';
  let phases = [], label = '';
  const warmMin = Math.min(5, Math.round(mins * 0.15));
  let coolMin = Math.min(4, Math.round(mins * 0.1));
  const main = Math.max(1, mins - warmMin - coolMin);
  phases.push({ k: 'easy', label: 'Warm up', sec: warmMin * 60 });
  // interval blocks that fit the time you have: [hard sec, easy sec] per level
  const blk = { beg: [60, 120, 'Push', 'Alternating effort. Hard means breathing heavily but in control.'], int: [180, 120, 'Tempo', 'Tempo blocks. Hard is comfortably uncomfortable, not all-out.'], adv: [150, 90, 'Hard', 'Intervals. Hard is near your limit for the block. Recover fully.'] }[lvl] || [60, 120, 'Push', ''];
  const reps = type === 'CL' ? 0 : Math.floor(main * 60 / (blk[0] + blk[1]));
  if (!reps) {
    label = 'Steady, easy effort. You should be able to talk in full sentences.';
    phases.push({ k: 'easy', label: 'Steady easy', sec: main * 60 });
  } else {
    label = blk[3];
    for (let i = 0; i < reps; i++) { phases.push({ k: 'hard', label: blk[2], sec: blk[0] }); phases.push({ k: 'easy', label: 'Recover', sec: blk[1] }); }
    const left = main * 60 - reps * (blk[0] + blk[1]);
    if (left >= 60) phases.push({ k: 'easy', label: 'Steady easy', sec: left });
  }
  phases.push({ k: 'easy', label: 'Cool down', sec: coolMin * 60 });
  phases = phases.filter(ph => ph.sec > 0);
  return { modeId: mode ? mode.id : 'walk', minutes: mins, phases, label, structure: reps ? 'intervals' : 'steady' };
}
function buildRide(p, dayIdx, minutesOverride) {
  const mins = minutesOverride || p.rideMinutes || 90;
  const warm = pickMob(3, dayIdx).filter(m => !MOBMAP[m].reg.includes('knee'));
  const cool = pickMob(4, dayIdx + 2);
  return { type: 'MTB', title: TYPE_INFO.MTB.title, kind: 'ride',
    ride: { modeId: 'mtb', minutes: mins },
    warmMob: warm.length ? warm : ['hipcircles', 'ankle', 'tspine'],
    coolMob: cool, holdSec: 40 };
}
function buildFlex(p, dayIdx) {
  const n = clamp(Math.floor(p.minutes / 4), 5, 10);
  const moves = []; for (let i = 0; i < n; i++) moves.push(MOB[(dayIdx * 7 + i * 3) % MOB.length].id);
  return { type: 'F', title: TYPE_INFO.F.title, kind: 'mobility', moves: moves.filter((m, i, a) => a.indexOf(m) === i), holdSec: p.minutes >= 40 ? 60 : 45, rounds: p.minutes >= 45 ? 2 : 1 };
}
function buildOne(code, p, dayIdx, minutes) {
  const pp = minutes ? Object.assign({}, p, { minutes }) : p;
  if (code === 'MTB') return buildRide(pp, dayIdx, minutes);
  const k = TYPE_INFO[code] ? TYPE_INFO[code].kind : 'strength';
  let s;
  if (k === 'strength') s = buildStrength(code, pp, dayIdx);
  else if (k === 'cardio') s = { type: code, title: TYPE_INFO[code].title, kind: 'cardio', cardio: buildCardio(code, pp, dayIdx), mobility: pp.goal === 'flex' ? pickMob(3, dayIdx) : [] };
  else s = buildFlex(pp, dayIdx);
  return s;
}
/* what the user can pick instead of today's plan */
function overrideOptions(p) {
  const out = [];
  ['S', 'U', 'L', 'C', 'CL', 'F'].forEach(code => out.push({ code, title: TYPE_INFO[code].title, kind: TYPE_INFO[code].kind }));
  if (availEquip(p).has('mtb')) out.unshift({ code: 'MTB', title: TYPE_INFO.MTB.title, kind: 'ride' });
  return out;
}
function buildProgram() {
  const p = S.profile; if (!p) return null;
  const days = [...p.days].sort((a, b) => a - b);
  const n = clamp(days.length, 1, 7);
  let codes = SPLITS[p.goal][n];
  const av = availEquip(p);
  const bare = !['db', 'kb', 'bb', 'band', 'bar', 'cable', 'machine'].some(k => av.has(k));
  if (bare && p.goal === 'strength' && n >= 6) codes = n === 6 ? ['S', 'U', 'L', 'S', 'U', 'L'] : ['S', 'U', 'L', 'C', 'S', 'U', 'L'];
  const mtbDays = new Set(p.mtbDays || []);
  const week = days.map((d, i) => {
    let code = codes[i];
    if (mtbDays.has(d) && availEquip(p).has('mtb')) code = 'MTB';
    const s = buildOne(code, p, i, null);
    s.day = d; s.idx = i;
    return s;
  });
  S.program = { id: uid(), createdAt: todayStr(), week, version: (S.program ? S.program.version + 1 : 1) };
  save();
  return S.program;
}

/* ---------- injury substitution ---------- */
function applyInjuries(sess, regions) {
  const bad = new Set(regions || []);
  if (!bad.size) return { sess, notes: [] };
  const p = S.profile, notes = [];
  const out = JSON.parse(JSON.stringify(sess));
  if (out.exercises) {
    const used = new Set(out.exercises.map(e => e.exId));
    out.exercises = out.exercises.map(e => {
      const ex = EXMAP[e.exId];
      if (!ex.reg.some(r => bad.has(r))) return e;
      const c = candidates(ex.pat, p, used, bad)[0];
      if (c) { used.add(c.id); notes.push(ex.n + ' → ' + c.n); return Object.assign({}, e, { exId: c.id, subbed: ex.id }); }
      notes.push(ex.n + ' removed'); return null;
    }).filter(Boolean);
  }
  if (out.cardio) {
    const m = CARDIOMAP[out.cardio.modeId];
    if (m && m.reg.some(r => bad.has(r))) {
      const alt = cardioModes(p).find(c => !c.reg.some(r => bad.has(r)));
      if (alt) { notes.push(m.n + ' → ' + alt.n); out.cardio.modeId = alt.id; }
      else { notes.push('Cardio replaced with easy walking'); out.cardio.modeId = 'walk'; }
      if (out.cardio.structure === 'intervals') { out.cardio.phases = out.cardio.phases.map(ph => Object.assign({}, ph, { k: 'easy', label: ph.label === 'Warm up' || ph.label === 'Cool down' ? ph.label : 'Steady easy' })); out.cardio.structure = 'steady'; notes.push('Intervals changed to steady'); }
    }
  }
  if (out.mobility) out.mobility = out.mobility.filter(id => !MOBMAP[id].reg.some(r => bad.has(r)));
  if (out.moves) out.moves = out.moves.filter(id => !MOBMAP[id].reg.some(r => bad.has(r)));
  if (out.warmMob) out.warmMob = out.warmMob.filter(id => !MOBMAP[id].reg.some(r => bad.has(r)));
  if (out.coolMob) out.coolMob = out.coolMob.filter(id => !MOBMAP[id].reg.some(r => bad.has(r)));
  if (out.ride) { const m = CARDIOMAP[out.ride.modeId]; if (m && m.reg.some(r => bad.has(r))) notes.push('Keep to smooth trails and stay seated — pick gentle terrain today'); }
  return { sess: out, notes };
}

function animFor(kind, id) {
  let key = null;
  if (kind === 'ex') key = EXANIM[id] || (EXMAP[id] && PATANIM[EXMAP[id].pat]);
  else if (kind === 'cardio') key = CARDIOANIM[id];

function propSvg(type, s) {
  const plateAt = (c, r) => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${r}" fill="#8c93ab" stroke="#5d6380" stroke-width="2"/><circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${(r * .28).toFixed(1)}" fill="#3a4058"/>`;
  const tr = (s._p && s._p.tor != null) ? s._p.tor : -90;
  switch (type) {
    case 'bb': return plateAt([(s.han[0] + s.han2[0]) / 2, (s.han[1] + s.han2[1]) / 2], 15);
    case 'bbBack': return plateAt(pol(pol(s.sho, tr - 90, 7), tr, 2), 15);
    case 'bbFront': return plateAt(pol(s.sho, tr + 90, 9), 15);
    case 'bbHip': return plateAt(pol(s.pel, tr + 90, 13), 15);
    case 'db': return `${plateAt(s.han2, 6)}${plateAt(s.han, 6.5)}`;
    case 'dbOne': return plateAt(s.han, 6.5);
    case 'dbSmall': return `${plateAt(s.han2, 5)}${plateAt(s.han, 5)}`;
    case 'barHigh': return `<line x1="${(s.han[0] - 30).toFixed(1)}" y1="${(s.han[1] - 2).toFixed(1)}" x2="${(s.han[0] + 30).toFixed(1)}" y2="${(s.han[1] - 2).toFixed(1)}" stroke="#6a7089" stroke-width="2" opacity=".35"/><circle cx="${s.han[0].toFixed(1)}" cy="${s.han[1].toFixed(1)}" r="4" fill="#8c93ab"/>`;
    case 'handle': return `<rect x="${(s.han[0] - 3).toFixed(1)}" y="${(s.han[1] - 8).toFixed(1)}" width="6" height="16" rx="3" fill="#8c93ab"/>`;
    case 'plate': { const c = [(s.ank[0] + s.ank2[0]) / 2, (s.ank[1] + s.ank2[1]) / 2], ft = s._p.ft, n = pol(c, ft + 90, -7), a = pol(n, ft, 20), b = pol(n, ft, -14);
      return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#8c93ab" stroke-width="7" stroke-linecap="round"/>`; }
    case 'rope': { const ry = s._p.ropeY != null ? s._p.ropeY : GROUND + 12, rx = s._p.ropeX != null ? s._p.ropeX : (s.han[0] + s.han2[0]) / 2 + 2;

      return `<path d="M${s.han[0].toFixed(1)} ${s.han[1].toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${s.han2[0].toFixed(1)} ${s.han2[1].toFixed(1)}" fill="none" stroke="var(--acc)" stroke-width="2.2"/>`; }
  }

}

    return h`<div class="card" style="border-color:var(--acc)"><div class="eyebrow">Unfinished session · ${esc(when)}</div><h3>${esc((a.sess || a.base).title)}</h3>

  },
  ignoreReady() { const r = S.readiness.find(x => x.date === todayStr()); if (r) { r.ignored = !r.ignored; save(); route(); } },
  manualReady() {
    sheet(h`<h3>How did you sleep?</h3><p class="mute small">If you don't have a ring or watch feeding Health, enter what you know. Leave blanks empty.</p>

};

/* =========================================================
   PLAN
   ========================================================= */
const Plan = {
  render() {
    const p = S.profile, pr = S.program;
    const done = new Set(S.sessions.map(s => s.date));
    const dow = new Date().getDay();
    return h`<div class="fade"><div class="topbar"><h1>Your week</h1><span class="pill">v${pr.version}</span></div>
      <div class="mute small mb">${['General fitness', 'Cardio emphasis', 'Strength emphasis', 'Flexibility emphasis'][['general', 'cardio', 'strength', 'flex'].indexOf(p.goal)]} · ${p.days.length} days · ${p.minutes} min · ${p.setting === 'gym' ? 'gym' : p.setting === 'home_eq' ? 'home with gear' : 'home, no gear'}</div>
      <div class="stack">${DAYS.map((n, d) => {
        const w = pr.week.find(x => x.day === d);
        const thisWeekDate = addDays(todayStr(), d - dow);
        const isDone = done.has(thisWeekDate);
        if (!w) return `<div class="item" style="opacity:.55"><div class="tag">${n}</div><div class="grow"><div class="title mute">Rest</div></div></div>`;
        const sub = w.kind === 'strength' ? w.exercises.map(e => EXMAP[e.exId].n).join(' · ') : w.kind === 'cardio' ? CARDIOMAP[w.cardio.modeId].n + ' · ' + w.cardio.label : w.kind === 'ride' ? 'Mountain bike · about ' + fmtMins(w.ride.minutes) + ' · plus stretching' : (w.moves || []).map(m => MOBMAP[m].n).join(' · ');
        return `<div class="item ${d === dow ? 'glow' : ''}" style="${d === dow ? 'border-color:var(--acc)' : ''}"><div class="tag ${isDone ? 'good' : d === dow ? 'acc' : ''}">${n}</div><div class="grow"><div class="title">${esc(w.title)} ${isDone ? '✓' : ''}</div><div class="sub">${esc(sub)}</div></div><button class="icon" onclick="Plan.detail(${w.idx})">›</button></div>`;
      }).join('')}</div>
      <div class="stack mt2"><button class="sec" onclick="Plan.regen()">Rebuild plan</button><button class="ghost" onclick="go('#/profile')">Change goal, days or gear</button></div>
      <p class="mute tiny mt">Rebuilding keeps your loads and history. Swapped exercises reset.</p></div>`;
  },
  detail(idx) {
    const w = S.program.week[idx];
    let body = '';
    if (w.kind === 'strength') body = `<div class="list">${w.exercises.map((e, i) => { const ex = EXMAP[e.exId]; const t = targetFor(e); return `<div class="item"><div class="figthumb">${Figure.svg('ex', ex.id)}</div><div class="grow"><div class="title">${esc(ex.n)}</div><div class="sub">${e.sets} × ${e.lo}–${e.hi}${t.weight != null ? ' · ' + fmtW(t.weight) : ex.bwOnly ? ' · bodyweight' : ' · pick a weight'}</div></div><button class="icon" onclick="Plan.swap(${idx},${i})">Swap</button></div>`; }).join('')}</div>${w.cardio ? `<div class="mt small mute">Finisher: ${CARDIOMAP[w.cardio.modeId].n}, ${w.cardio.minutes} min</div>` : ''}${w.mobility && w.mobility.length ? `<div class="mt small mute">Warm-up mobility: ${w.mobility.map(m => MOBMAP[m].n).join(', ')}</div>` : ''}`;
    else if (w.kind === 'cardio') body = `<div class="figbox mb">${Figure.svg('cardio', w.cardio.modeId)}</div><div class="card2"><b>${CARDIOMAP[w.cardio.modeId].n}</b><div class="mute small">${esc(w.cardio.label)}</div><div class="mt list">${w.cardio.phases.map(ph => `<div class="item"><div class="tag ${ph.k === 'hard' ? 'hot' : ''}">${ph.k}</div><div class="grow">${esc(ph.label)}</div><div class="num mute">${Math.floor(ph.sec / 60)}:${String(ph.sec % 60).padStart(2, '0')}</div></div>`).join('')}</div></div>`;
    else if (w.kind === 'ride') body = `<div class="figbox mb">${Figure.svg('cardio', 'mtb')}</div><div class="card2"><b>Mountain bike · about ${fmtMins(w.ride.minutes)}</b><div class="mute small">Stretch before and after. The trail sets the effort.</div></div><div class="mute small mt">Before: ${(w.warmMob || []).map(m => esc(MOBMAP[m].n)).join(', ')}</div><div class="mute small">After: ${(w.coolMob || []).map(m => esc(MOBMAP[m].n)).join(', ')}</div>`;
    else body = `<div class="list">${(w.moves || []).map(m => `<div class="item"><div class="figthumb">${Figure.svg('mob', m)}</div><div class="grow"><div class="title">${esc(MOBMAP[m].n)}</div><div class="sub">${esc(MOBMAP[m].cue)}</div></div><div class="num mute">${w.holdSec}s</div></div>`).join('')}</div><div class="mute small mt">${w.rounds} round${w.rounds > 1 ? 's' : ''}</div>`;
    sheet(`<h3>${esc(w.title)} · ${DAYSL[w.day]}</h3><div class="mt">${body}</div><div class="stack mt2"><button onclick="closeSheet();Session.start(${idx})">Start this session</button><button class="ghost" onclick="closeSheet()">Close</button></div>`);
  },
  swap(idx, slot) {
    const w = S.program.week[idx]; const e = w.exercises[slot]; const ex = EXMAP[e.exId];
    const used = new Set(w.exercises.map(x => x.exId)); used.delete(ex.id);
    const c = candidates(ex.pat, S.profile, used);
    closeSheet();
    sheet(`<h3>Swap ${esc(ex.n)}</h3><p class="mute small">Same movement pattern, your equipment.</p><div class="list mt">${c.map(x => `<div class="item ${x.id === ex.id ? 'on' : ''}" onclick="Plan.doSwap(${idx},${slot},'${x.id}')"><div class="figthumb">${Figure.svg('ex', x.id)}</div><div class="grow"><div class="title">${esc(x.n)}</div><div class="sub">${esc(x.cue)}</div></div>${x.id === ex.id ? '<span class="tag acc">current</span>' : ''}</div>`).join('')}</div>`);
  },
  doSwap(idx, arrIdx, exId) { const e = S.program.week[idx].exercises[arrIdx]; S.swaps[idx + ':' + (e.slot != null ? e.slot : arrIdx)] = exId; buildProgram(); closeSheet(); route(); },
  regen() { S.swaps = {}; buildProgram(); toast('Plan rebuilt'); route(); }
};
/* =========================================================
   SESSION
   ========================================================= */
let TMR = null;
const Session = {
  hasProgress(a) {
    a = a || S.active; if (!a || a.stage === 'precheck' || a.stage === 'done') return false;
    return (a.entries || []).some(e => e.sets.some(s => s.done)) || (a.rideSec || 0) > 60 || (a.mobIdx || 0) > 0 || (a.phaseIdx || 0) > 0 || !!a.cardio;
  },
  // finish a session that was left open, recording only what was actually done
  saveWhatsDone() {
    const a = S.active; if (!a) return;
    clearInterval(TMR);
    if (a.sess && a.sess.kind === 'ride' && !a.ride && a.rideSec) a.ride = { modeId: 'mtb', minutes: Math.max(1, Math.round(Session.rideSecNow(a) / 60)), effort: 'mod', distanceKm: null };
    if (a.sess && (a.sess.kind === 'cardio' || a.stage === 'tail') && !(a.cardio && a.cardio.minutes)) {
      const c = a.sess.cardio, el = c.phases.slice(0, a.phaseIdx).reduce((n, p) => n + p.sec, 0) + (c.phases[a.phaseIdx] ? c.phases[a.phaseIdx].sec - (a.phaseLeft ?? c.phases[a.phaseIdx].sec) : 0);
      a.cardio = { modeId: c.modeId, minutes: Math.max(1, Math.round(el / 60)), effort: 'mod', distanceKm: null };
    }
    Session.complete();
    toast('Saved what you logged', 3000);
  },
  start(idx, codeOverride) {
    if (Session.hasProgress() && !confirm('You have an unfinished session with progress logged. Start a new one and discard it?')) { go('#/session'); return; }
    const w = S.program.week[idx];
    const code = codeOverride || w.type;
    const def = code === 'MTB' ? (S.profile.rideMinutes || 90) : S.profile.minutes;
    S.active = { id: uid(), idx, code, minutes: def, base: null, stage: 'precheck', injuries: [], startedAt: Date.now(), entries: [], cardio: null, ride: null, checkin: null, notes: [] };
    S.active.base = JSON.parse(JSON.stringify(code === w.type ? w : buildOne(code, S.profile, idx, def)));
    save(); go('#/session');
  },
  setMinutes(m) {
    const a = S.active; a.minutes = m;
    a.base = JSON.parse(JSON.stringify(buildOne(a.code, S.profile, a.idx, m)));
    save(); route();
  },
  pickType() {
    const a = S.active;
    sheet(`<h3>Do something else today</h3><p class="mute small">Your plan stays as it is. This just changes today.</p><div class="list mt">${overrideOptions(S.profile).map(o => `<div class="item ${a.code === o.code ? 'on' : ''}" style="${a.code === o.code ? 'border-color:var(--acc)' : ''}" onclick="Session.setType('${o.code}')"><div class="grow"><div class="title">${esc(o.title)}</div><div class="sub">${o.kind === 'ride' ? 'Ride plus stretching, nothing else' : o.kind === 'cardio' ? 'Cardio session' : o.kind === 'mobility' ? 'Mobility only' : 'Strength session'}</div></div>${a.code === o.code ? '<span class="tag acc">today</span>' : ''}</div>`).join('')}</div>`);
  },
  setType(code) {
    const a = S.active; a.code = code;
    a.minutes = code === 'MTB' ? (S.profile.rideMinutes || 90) : S.profile.minutes;
    a.base = JSON.parse(JSON.stringify(buildOne(code, S.profile, a.idx, a.minutes)));
    a.injuries = a.injuries || []; closeSheet(); save(); route();
  },
  pickAny() {
    const mtb = availEquip(S.profile).has('mtb');
    sheet(`<h3>Which session?</h3><div class="list mt">${mtb ? `<div class="item" onclick="closeSheet();Session.start(0,'MTB')"><div class="tag acc">ride</div><div class="grow"><div class="title">Mountain Bike Ride</div><div class="sub">Ride plus stretching, nothing else</div></div></div>` : ''}${S.program.week.map(w => `<div class="item" onclick="closeSheet();Session.start(${w.idx})"><div class="tag">${DAYS[w.day]}</div><div class="grow"><div class="title">${esc(w.title)}</div></div></div>`).join('')}</div>`);
  },
  abandon() { if (!confirm('Leave this session? Nothing will be saved.')) return; clearInterval(TMR); S.active = null; save(); go('#/today'); },
  render() {
    const a = S.active; if (!a) return `<div class="fade"><p>No session in progress.</p><button onclick="go('#/today')">Back</button></div>`;
    if (a.stage === 'precheck') return Session.rPre(a);
    if (a.stage === 'calib') return Session.rCalib(a);
    if (a.stage === 'work') return a.sess.kind === 'strength' ? Session.rStrength(a) : a.sess.kind === 'cardio' ? Session.rCardio(a) : a.sess.kind === 'ride' ? Session.rRide(a) : Session.rMob(a);
    if (a.stage === 'tail') return Session.rCardio(a, true);
    if (a.stage === 'done') return Session.rDone(a);
    return '';
  },
  mount() { const a = S.active; if (!a) return; if (a.stage === 'work' && a.sess.kind === 'cardio' || a.stage === 'tail') Session.tickStart(); if (a.stage === 'work' && a.sess.kind === 'ride') Session.rideTick(); },

  /* ----- pre-check ----- */
  rPre(a) {
    const mod = readinessMod();
    const isRide = a.code === 'MTB';
    const opts = isRide ? [45, 60, 90, 120, 180] : [15, 20, 30, 45, 60, 75];
    return h`<div class="fade"><div class="topbar"><button class="back" onclick="Session.abandon()">✕</button><h2>${esc(a.base.title)}</h2><span></span></div>
      <div class="card"><div class="between"><div><div class="eyebrow">Today's session</div><h3>${esc(a.base.title)}</h3></div><button class="sm sec" style="width:auto" onclick="Session.pickType()">Change</button></div>
        <div class="mute small mt">${isRide ? 'Ride plus stretching. No lifting today — the ride is the session.' : a.base.kind === 'cardio' ? CARDIOMAP[a.base.cardio.modeId].n : a.base.kind === 'mobility' ? a.base.moves.length + ' moves' : a.base.exercises.length + ' exercises'}</div></div>
      <div class="card mt"><h3>How long have you got${isRide ? ' to ride' : ''}?</h3><p class="mute small">${isRide ? 'Rough is fine — the timer just counts up and you finish when you finish.' : 'The session is built to fit. Shorter means fewer exercises, not rushed ones.'}</p>
        <div class="chips mt">${opts.map(m => `<span class="chip ${a.minutes === m ? 'on' : ''}" onclick="Session.setMinutes(${m})">${fmtMins(m)}</span>`).join('')}</div></div>
      <div class="card mt"><h3>Anything sore or injured?</h3><p class="mute small">Tap any area that hurts. ${isRide ? 'You will get terrain advice instead of exercise swaps.' : 'Exercises that load it get swapped for safer ones.'}</p>
      <div class="chips mt">${REGIONS.map(([k, l]) => `<span class="chip ${a.injuries.includes(k) ? 'on' : ''}" onclick="Session.togInj('${k}')">${l}</span>`).join('')}</div></div>
      ${(a.base.kind === 'cardio' || isRide) ? Session.hrCard() : ''}
      ${mod.notes.length ? `<div class="card mt"><b>Today's adjustments</b><ul class="ol mute small">${mod.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : ''}
      <div class="stack mt2"><button onclick="Session.begin()">${a.injuries.length ? 'Adjust and start' : 'Start'}</button></div></div>`;
  },
  hrCard() {
    const [z2lo, z2hi] = zoneRange(2), [z4lo, z4hi] = zoneRange(4);
    if (HR.live) return h`<div class="card mt" style="border-color:var(--good)"><div class="between"><div><b class="good">Heart rate connected</b><div class="mute small">Live guidance during the session.</div></div><div class="big">${HR.bpm || '—'}</div></div></div>`;
    return h`<div class="card mt"><b>Heart rate guidance</b>
      <div class="mute small">Your zones: easy ${z2lo}–${z2hi}, hard ${z4lo}–${z4hi} bpm. Max estimated at ${maxHR()}, resting ${restHR()}.</div>
      ${HR.supported() ? `<div class="row mt"><button class="sm" onclick="HR.connect()">Connect a strap or watch</button></div><div class="mute tiny mt">Put your Garmin in Broadcast Heart Rate mode first.</div>`
        : `<div class="mute tiny mt">Safari can't reach Bluetooth, so the app will ask you for your heart rate now and then instead. Tap it off your watch when prompted. <a href="#/more" onclick="event.stopPropagation()">More on live feeds</a></div>`}</div>`;
  },
  togInj(k) { const a = S.active; const i = a.injuries.indexOf(k); if (i > -1) a.injuries.splice(i, 1); else a.injuries.push(k); save(); route(); },
  begin() {
    const a = S.active;
    HR.hist = []; HR.warnAt = 0;
    const { sess, notes } = applyInjuries(a.base, a.injuries);
    a.sess = sess; a.notes = notes;
    const mod = readinessMod();
    if (sess.exercises) sess.exercises.forEach(e => { e.sets = Math.max(1, e.sets + mod.sets); });
    if (notes.length) toast(notes.join(' · '), 3500);
    // calibration queue: exercises never seen before, not bodyweight-only timed
    a.calibQ = (sess.exercises || []).filter(e => { const ex = EXMAP[e.exId]; return !S.loads[ex.id] && !S.calib[ex.id]; }).map(e => e.exId);
    if (sess.kind === 'strength') a.entries = sess.exercises.map(e => { const t = targetFor(e); return { exId: e.exId, lo: e.lo, hi: e.hi, subbed: e.subbed || null, sets: Array.from({ length: e.sets }, () => ({ reps: t.reps, weight: t.weight, rpe: null, done: false })) }; });
    a.stage = a.calibQ.length ? 'calib' : 'work';
    a.startedAt = Date.now();
    a.phaseIdx = 0; a.phaseLeft = null; a.paused = false; a.mobIdx = 0; a.rideSec = 0; a.ridePart = 'warm'; a.hrAsk = 0;
    save(); route();
  },

  /* ----- calibration ----- */
  rCalib(a) {
    const exId = a.calibQ[0]; const ex = EXMAP[exId]; const en = a.entries.find(e => e.exId === exId);
    const bw = ex.bwOnly;
    return h`<div class="fade"><div class="topbar"><button class="back" onclick="Session.abandon()">✕</button><span class="pill">First time · ${a.calibQ.length} to set</span><span></span></div>
      <div class="card"><div class="eyebrow">New exercise</div><h2>${esc(ex.n)}</h2><div class="figbox mt">${Figure.svg('ex', ex.id)}<div class="cap">watch the movement</div></div><div class="mute small mt">${esc(ex.cue)}</div></div>
      <div class="card mt"><h3>Quick test</h3>
      ${bw ? `<p class="mute small">${ex.timed ? 'Hold it as long as you can with good form. Enter the seconds.' : 'Do as many good reps as you can. Stop when form breaks.'}</p><label class="mt">${ex.timed ? 'Seconds held' : 'Reps'}</label><input id="cReps" type="number" inputmode="numeric" placeholder="${ex.timed ? '30' : '10'}">`
        : `<p class="mute small">Pick a weight you think you could lift about 10 times. Do one set to near-failure — stop at 15 if you get there. Enter what happened.</p><div class="inline mt"><div><label>Weight (${unitW()})</label><input id="cW" type="number" inputmode="decimal"></div><div><label>Reps</label><input id="cReps" type="number" inputmode="numeric"></div></div>`}
      <div class="stack mt2"><button onclick="Session.calibSave('${exId}')">Set my starting point</button><button class="ghost" onclick="Session.calibSkip('${exId}')">Skip — I'll pick weights as I go</button></div></div></div>`;

  },
  cue(exId) { const ex = EXMAP[exId]; sheet(`<h3>${esc(ex.n)}</h3><div class="figbox mt">${Figure.svg('ex', ex.id)}</div><p class="mt">${esc(ex.cue)}</p><p class="mute small">Loads: ${ex.reg.length ? ex.reg.map(r => REGIONS.find(x => x[0] === r)[1]).join(', ') : 'low joint stress'}</p><button class="ghost" onclick="closeSheet()">Close</button>`); },
  setW(ei, si, v) { const s = S.active.entries[ei].sets[si]; s.weight = v === '' || !(+v > 0) ? null : toKg(+v); if (si === 0) S.active.entries[ei].sets.slice(1).forEach(x => { if (!x.done) x.weight = s.weight; }); save(); },

  addSet(ei) { const e = S.active.entries[ei]; const last = e.sets[e.sets.length - 1]; e.sets.push({ reps: last.reps, weight: last.weight, rpe: null, done: false }); save(); route(); },
  checkin(v) {

  /* ----- cardio timer ----- */

      <div class="list mt">${c.phases.map((p, i) => `<div class="item" style="${i === a.phaseIdx ? 'border-color:var(--acc)' : i < a.phaseIdx ? 'opacity:.45' : ''}"><div class="tag ${p.k === 'hard' ? 'hot' : ''}">${p.k}</div><div class="grow">${esc(p.label)}</div><span class="num mute">${Math.floor(p.sec / 60)}:${String(p.sec % 60).padStart(2, '0')}</span></div>`).join('')}</div>
      <div class="card mt"><b>Stop if</b><div class="mute small">you feel chest pain, faint, or can't catch your breath during a recovery block. That is not pushing through — that is a signal.</div></div></div>`;
  },
  tickStart() {
    clearInterval(TMR);
    const a = S.active; if (!a) return; const c = a.sess.cardio; if (!c) return;

      const a = S.active; if (!a || a.paused) return;

  skipPhase() { const a = S.active; a.phaseIdx++; if (a.phaseIdx >= a.sess.cardio.phases.length) { Session.finishCardio(); return; } a.phaseLeft = a.sess.cardio.phases[a.phaseIdx].sec; save(); route(); },
  finishCardio() {

      <div class="stack mt2"><button onclick="Session.endRide()">Finished riding</button></div></div>`;
  },
  rideSecNow(a) {

  rideTick() {

      ${done ? `<div class="card hero glow" style="min-height:200px"><div class="heroArt">${Art.ribbon()}</div><div class="heroBody"><h2>All done. Breathe.</h2></div></div>` : `<div class="card"><div class="eyebrow">Round ${Math.floor(i / s.moves.length) + 1} · hold ${s.holdSec}s</div><h2>${esc(mv.n)}</h2><div class="figbox mt">${Figure.svg('mob', s.moves[i % s.moves.length])}</div><div class="mute small mt">${esc(mv.cue)}</div></div>`}
      <div class="bar mt"><i style="width:${Math.min(i, total) / total * 100}%"></i></div>

      <div class="list mt2">${s.moves.map((m, k) => `<div class="item" style="${k === i % s.moves.length && !done ? 'border-color:var(--acc)' : ''}"><div class="figthumb">${Figure.svg('mob', m)}</div><div class="grow"><div class="title">${esc(MOBMAP[m].n)}</div></div><span class="num mute">${s.holdSec}s</span></div>`).join('')}</div></div>`;
  },
  mobNext() { S.active.mobIdx++; save(); route(); if (navigator.vibrate) navigator.vibrate(12); },
  hrNoop() { },

  /* ----- complete ----- */
  // minutes you actually trained. If the session was left open (forgot to press Finish), use the last thing you logged instead.
  realMinutes(a) {
    const el = (Date.now() - a.startedAt) / 60000, planned = a.minutes || (S.profile && S.profile.minutes) || 45;
    if (el <= Math.max(planned * 2, planned + 45)) return { minutes: Math.max(1, Math.round(el)), capped: false };
    let est = planned;
    const ticks = []; (a.entries || []).forEach(e => e.sets.forEach(s => { if (s.done && s.at) ticks.push(s.at); }));
    if (ticks.length) est = (Math.max(...ticks) - a.startedAt) / 60000 + 2;
    if (a.sess.kind === 'cardio' && a.cardio) est = a.cardio.minutes + 2;
    if (a.sess.kind === 'ride' && a.ride) est = a.ride.minutes + ((a.sess.warmMob || []).length + (a.sess.coolMob || []).length) * ((a.sess.holdSec || 40) + 15) / 60;
    if (a.sess.kind === 'mobility') est = (a.mobIdx || 1) * ((a.sess.holdSec || 45) + 15) / 60;
    if (a.cardio && a.sess.kind === 'strength') est += a.cardio.minutes;
    return { minutes: Math.max(1, Math.round(Math.min(est, el))), capped: true };
  },
  complete() {
    clearInterval(TMR);
    const a = S.active; if (!a || !a.sess) { go('#/today'); return; }
    const p = S.profile;
    const rm = Session.realMinutes(a), minutes = rm.minutes;
    if (rm.capped) setTimeout(() => toast('Recorded as ' + minutes + ' min — the session was left open after you finished.', 4500), 400);
    let kcal = 0, kind = a.sess.kind;
    if (kind === 'strength') { const strengthMin = a.cardio ? Math.max(5, minutes - a.cardio.minutes) : minutes; kcal += kcalFor('strength', strengthMin); }
    if (a.cardio) kcal += kcalFor('cardio', a.cardio.minutes, a.cardio.effort, a.cardio.modeId);
    if (a.ride) kcal += kcalFor('cardio', a.ride.minutes, a.ride.effort, a.ride.modeId);
    if (kind === 'mobility') kcal += kcalFor('mobility', minutes);
    const prevPRs = Object.fromEntries(Object.entries(S.loads).map(([k, v]) => [k, v.pr || 0]));
    const hrAvg = HR.avg(), hrPeak = HR.peak();
    const rec = { id: a.id, date: dstr(new Date(a.startedAt)), idx: a.idx, type: a.sess.type, title: a.sess.title, kind, entries: a.entries, cardio: a.cardio || a.ride, ride: !!a.ride, minutes, planned: a.minutes, calories: kcal, injuries: a.injuries, notes: a.notes, checkin: a.checkin, hrAvg, hrPeak, synced: false, feedback: null };
    if (kind === 'strength') progressAfter(rec);
    HR.hist = [];
    rec.prs = Object.entries(S.loads).filter(([k, v]) => (v.pr || 0) > (prevPRs[k] || 0) && prevPRs[k] > 0).map(([k]) => EXMAP[k].n);
    S.sessions.push(rec); a.stage = 'done'; a.result = rec.id; save(); route();
  },
  rDone(a) {

/* =========================================================
   BACKUP MERGE — add what's missing, skip exact copies, ask about differences
   ========================================================= */
const Merge = {
  // same content = same JSON once keys are sorted. The id and Health-sync flag are bookkeeping, not workout data.
  canon(v) {
    if (Array.isArray(v)) return '[' + v.map(x => Merge.canon(x)).join(',') + ']';
    if (v && typeof v === 'object') return '{' + Object.keys(v).filter(k => k !== 'id' && k !== 'synced' && v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + Merge.canon(v[k])).join(',') + '}';
    return JSON.stringify(v === undefined ? null : v);
  },
  byDate(list) { const m = {}; list.forEach(x => { (m[x.date] = m[x.date] || []).push(x); }); return m; },
  sameDay(a, b) { const ca = a.map(Merge.canon).sort(), cb = b.map(Merge.canon).sort(); return ca.length === cb.length && ca.every((x, i) => x === cb[i]); },
  start(inc) {
    const mine = Merge.byDate(S.sessions), theirs = Merge.byDate(inc.sessions);
    let added = 0, same = 0; const conflicts = [];
    Object.keys(theirs).sort().forEach(d => {
      if (!mine[d]) { theirs[d].forEach(x => S.sessions.push(x)); added += theirs[d].length; }
      else if (Merge.sameDay(mine[d], theirs[d])) same++;
      else conflicts.push({ date: d, mine: mine[d], theirs: theirs[d] });
    });
    const other = Merge.others(inc);
    Merge.sortSessions(); save();
    Merge.job = { conflicts, i: 0, added, same, replaced: 0, kept: 0, other };
    Merge.next();
  },
  // weigh-ins, readiness and saved loads: add what's missing, never overwrite what's here
  others(inc) {
    let n = 0;
    const addBy = (key, list, keyFn) => { const have = new Set(S[key].map(keyFn)); list.forEach(x => { const k = keyFn(x); if (!have.has(k)) { S[key].push(x); have.add(k); n++; } }); };
    addBy('weights', inc.weights, w => w.date + '|' + (w.source || ''));
    addBy('readiness', inc.readiness, r => r.date);
    addBy('intake', inc.intake || [], x => x.weekOf);
    addBy('adjust', inc.adjust || [], Merge.canon);
    S.weights.sort((a, b) => a.date < b.date ? -1 : 1); S.readiness.sort((a, b) => a.date < b.date ? -1 : 1);
    ['calib', 'loads'].forEach(k => Object.keys(inc[k] || {}).forEach(id => { if (!S[k][id]) { S[k][id] = inc[k][id]; n++; } }));
    return n;
  },
  sortSessions() { S.sessions = S.sessions.map((x, i) => [x, i]).sort((a, b) => a[0].date < b[0].date ? -1 : a[0].date > b[0].date ? 1 : a[1] - b[1]).map(x => x[0]); },
  summary(list) {
    return list.map(x => {
      const bits = [esc(x.title || 'Workout'), (x.minutes || 0) + ' min'];
      if (x.entries && x.entries.length) {
        const sets = x.entries.reduce((n, e) => n + (e.sets || []).filter(q => q.done).length, 0);
        bits.push(x.entries.length + ' exercise' + (x.entries.length > 1 ? 's' : ''), sets + ' set' + (sets === 1 ? '' : 's') + ' done');
      }
      if (x.calories) bits.push(Math.round(x.calories) + ' kcal');
      return '<div class="small">' + bits.join(' · ') + '</div>';
    }).join('');
  },
  next() {
    const j = Merge.job; if (!j) return;
    if (j.i >= j.conflicts.length) { Merge.finish(); return; }
    const c = j.conflicts[j.i], left = j.conflicts.length - j.i;
    const old = $('.sheetBg'); if (old) old.remove();
    // built by hand, not with sheet(): tapping outside must not skip a decision
    const bg = document.createElement('div'); bg.className = 'sheetBg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mgT">
      <div class="handle"></div>

function copyText(t, msg) {
  const done = () => toast(msg || 'Copied');
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(done, () => fallback()); }
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed — select it by hand'); }
    ta.remove();
  }
}

  test(k) { if (!S.shortcuts[k]) { toast('Set a name first'); return; } Bridge.run(k, k === 'logStrength' || k === 'logCardio' ? '20,120' : k === 'logWeight' ? fmtWn(curWeightKg() || 75, 1) : null, { test: true }); },
  howShare() { sheet(`<h3>Getting the iCloud link</h3><ol class="ol small"><li>Open the <b>Shortcuts</b> app</li><li>Tap the <b>…</b> on the shortcut to open it</li><li>Tap the <b>share</b> icon</li><li>Tap <b>Copy iCloud Link</b>, then <b>Copy Link</b></li><li>Come back here and paste it in</li></ol><p class="mute small">iCloud links install on any iPhone without changing settings. To send a shortcut straight to a friend in your contacts instead, both of you need Settings → Shortcuts → <b>Private Sharing</b> turned on.</p><button class="ghost" onclick="closeSheet()">Close</button>`); },
  invite() {
    const payload = { n: {}, l: {} };
    SC_ORDER.forEach(k => { if (S.scLinks[k] && SAFE_LINK.test(S.scLinks[k])) { payload.n[k] = S.shortcuts[k]; payload.l[k] = S.scLinks[k]; } });
    if (!Object.keys(payload.l).length) { toast("Those don't look like iCloud shortcut links. Use Share → Copy iCloud Link in Shortcuts.", 4500); return; }
    payload.by = (S.profile && S.profile.name) || '';
    const url = BASE + '#/invite/' + b64e(JSON.stringify(payload));
    sheet(`<h3>Invite link</h3><p class="mute small">Send this to a friend. It opens the app on their phone and offers one-tap install for each shortcut you linked.</p>
      <div class="item mt" style="background:var(--field)"><div class="grow tiny" style="word-break:break-all">${esc(url)}</div></div>
      <div class="stack mt2"><button onclick="copyText(${JSON.stringify(url).replace(/"/g, '&quot;')},'Invite link copied')">Copy link</button><button class="ghost" onclick="closeSheet()">Close</button></div>
      <p class="mute tiny mt">Their workout data stays on their own phone. Nothing is shared but the shortcut links.</p>`);
  }
};

const SAFE_LINK = /^https:\/\/(www\.)?icloud\.com\/shortcuts\/[A-Za-z0-9]+\/?$/;
function cleanInvite(p) {
  if (!p || typeof p !== 'object') return null;
  const out = { n: {}, l: {}, by: String(p.by || '').replace(/[\u0000-\u001f]/g, '').slice(0, 40) };
  SC_ORDER.forEach(k => {
    const link = p.l && typeof p.l[k] === 'string' ? p.l[k].trim() : '', name = p.n && typeof p.n[k] === 'string' ? p.n[k].replace(/[\u0000-\u001f]/g, '').trim().slice(0, 60) : '';
    if (SAFE_LINK.test(link) && name) { out.l[k] = link; out.n[k] = name; }
  });
  return out;
}
const Invite = {
  render(data) {
    let p = null;
    try { p = cleanInvite(JSON.parse(b64d(data || ''))); } catch (e) { }
    Invite._p = p;
    if (!p || !p.l || !Object.keys(p.l).length) return `<div class="fade"><h2>Invite link didn't work</h2><p class="mute">That link looks incomplete. Ask for a fresh one.</p><button onclick="go('#/today')">Continue to the app</button></div>`;
    const keys = SC_ORDER.filter(k => p.l[k]);
    return h`<div class="fade"><div class="card hero glow artRight" style="min-height:190px"><div class="heroArt">${Art.rocket(false)}</div><div class="heroBody"><div class="eyebrow">${p.by ? esc(p.by) + ' shared these with you' : 'Shared with you'}</div><h1>Connect<br>Apple Health</h1></div></div>
      <p class="mute small mt">Tap each one, then tap <b>Get Shortcut</b> on the page that opens. They let this app read and write your Health data. Nothing leaves your phone.</p>
      <div class="stack mt">${keys.map((k, i) => `<div class="item"><div class="tag acc">${i + 1}</div><div class="grow"><div class="title">${esc(SC_STEPS[k].title)}</div><div class="sub">${esc(p.n[k])}</div></div><a href="${esc(p.l[k])}" target="_blank" rel="noopener"><button class="sm">Install</button></a></div>`).join('')}</div>
      <div class="card mt2"><b>If a link won't open</b><div class="mute small">Make sure the Shortcuts app is installed and you're signed in to iCloud. iCloud links install without any extra settings.</div></div>
      <div class="stack mt2"><button onclick="Invite.accept()">Done — set up my plan</button></div>
      <p class="mute tiny mt">Your workouts, weight and plan stay on this phone only.</p></div>`;
  },
  accept() {
    const p = Invite._p; if (p) { Object.keys(p.l).forEach(k => { S.shortcuts[k] = p.n[k]; S.scLinks[k] = p.l[k]; S.scBuilt[k] = true; }); save(); }
    go(S.profile ? '#/today' : '#/onboard');
  }
};

/* =========================================================
   BOOT
   ========================================================= */
window.addEventListener('hashchange', route);
(function boot() {
  const r = Bridge.receive();
  if (r && r.slot) { if (r.slot === 'logWeight' || r.slot === 'readWeight') location.hash = '#/progress'; else if (r.slot === 'readiness') location.hash = '#/today'; }
  if (S.active && S.active.stage && S.active.stage !== 'done' && !location.hash.startsWith('#/session')) {
    // resume an interrupted session; older ones wait on Today with Resume / Save / Discard
    const riding = S.active.ridePart === 'ride' && Date.now() - S.active.startedAt < 8 * 3600000;
    if (Date.now() - S.active.startedAt < 3 * 3600000 || riding) location.hash = '#/session';
  }
  if (load.failed) setTimeout(() => toast("Saved data couldn't be read, so the app started fresh. A copy was kept — import a backup to restore.", 7000), 600);
  if (!location.hash) location.hash = S.profile ? '#/today' : '#/onboard';
  route();
  if (S.profile && S.program && S.program.week.some(w => w.day == null)) buildProgram();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && route._day && route._day !== todayStr() && !location.hash.startsWith('#/session')) route(); });
  window.addEventListener('storage', e => { if (e.key === KEY && !S.active) { S = load(); route(); } });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist(); }).catch(() => { }); } catch (e) { }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
